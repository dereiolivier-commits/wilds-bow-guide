<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wilds Bow Guide</title><link rel="icon" href="img/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar, sidebar of tinted nav cards, content column of dark in-game style cards
   (same look as the channel's build and skill infographics). One committed dark look. */
:root{
  --ground:#1b1d19;      /* page, slight olive bias like the preview backdrop */
  --card:#2e2e2e;        /* default card */
  --card-deep:#242424;   /* header band / inset */
  --edge:#121212;        /* thick near-black card border */
  --shadow:#0b0b0a;
  --line:#3a3a38;
  --cream:#f1e6cc;       /* titles */
  --ink:#ddd7c8;         /* body text */
  --muted:#a29d90;
  --amber:#e0a83a; --link:#8fd6ea; --blue:#5b87b8; --teal:#4fa08a; --red:#c4555a;
  --pip:#b37a0a; --pip-empty:#1f1f1f; --pip-empty-edge:#5a5a5a; --pip-set:#33cc33;
  /* icon tints */
  --t-red:#463839; --t-blue:#363c4d; --t-tan:#443d31; --t-purple:#3f3747; --t-teal:#33433f; --t-grey:#393b40;
  --ph:#e0c47a; --ph-bg:#2d2918;
  --font:"Montserrat","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card-deep)}
a{color:var(--link);text-underline-offset:2px}a:hover{color:#c4ecf8}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
h1,h2,h3{color:var(--cream);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}

/* shared card look */
.card{background:var(--card);border:3px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--shadow);overflow:hidden}
.card>.band{background:var(--card-deep);padding:.65rem 1rem;color:var(--cream);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.7rem;border-bottom:2px solid var(--edge)}
.ico{width:38px;height:38px;flex:none;display:block}
.t-red{--card:var(--t-red);--card-deep:#382c2d}
.t-blue{--card:var(--t-blue);--card-deep:#2b303e}
.t-tan{--card:var(--t-tan);--card-deep:#373127}
.t-purple{--card:var(--t-purple);--card-deep:#322b39}
.t-teal{--card:var(--t-teal);--card-deep:#283632}
.t-grey{--card:var(--t-grey);--card-deep:#2e3034}

/* pips, same as the build cards */
.pips{display:flex;gap:5px}
.pips i{display:block;width:16px;height:16px;border-radius:4px;background:var(--pip);border:2px solid var(--edge)}
.pips i.e{background:var(--pip-empty);border-color:var(--pip-empty-edge)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card-deep);border-bottom:3px solid var(--edge);display:flex;align-items:center;gap:.75rem;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--cream);font-weight:800;font-size:1.1rem;letter-spacing:.01em;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:50%;display:block}
.top .spacer{flex:1}
/* PC home: the home page cards already list every section, so hide the duplicate sidebar there (Olivier) */
@media (min-width:821px){body.is-home .shell{grid-template-columns:minmax(0,1fr)}body.is-home nav.side{display:none}body.is-home .view{margin:0 auto;max-width:860px}}
@media (max-width:560px){span.ph{white-space:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}}
.brand{min-width:0}.brand-t{overflow:hidden;text-overflow:ellipsis}
#searchBtn{display:inline-flex;align-items:center;gap:.4rem}.sico{width:16px;height:16px;flex:none}
@media (max-width:440px){.slbl{display:none}#searchBtn{padding:.35rem .55rem}.sico{width:20px;height:20px}.top{gap:.5rem}.brand{font-size:1rem;gap:.4rem}.brand .logo{width:30px;height:30px}.top .iconbtn{padding:.35rem .6rem;font-size:.85rem}}
.iconbtn{background:var(--card);border:2px solid var(--edge);color:var(--cream);border-radius:10px;padding:.4rem .75rem;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.iconbtn:hover{background:#383838}
.kbd{color:var(--muted);font-weight:500;margin-left:.3rem}
.menu-btn{display:none}

/* Advanced Combos table (from Olivier's Power and CRC Combos chart) */
.cb-legend{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;margin:.4rem 0 1.2rem;font-size:.9rem;color:var(--ink)}
.cb-legend span{display:inline-flex;align-items:center;gap:.45rem}
.cbk{display:inline-block;font-weight:800;font-size:.85rem;line-height:1;padding:.42em .55em;border-radius:7px;background:#1f1f1f;border:2px solid #121212;color:var(--cream);box-shadow:inset 0 0 0 1px #3c3c3c}
.cbk.dash{background:transparent;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px #4a463c;border-color:transparent}
.cbk.td{background:#b5832a;color:#fff6e0;box-shadow:inset 0 0 0 1px #d4a24b}
.cbk.dd{background:#b5832a;color:#fff6e0;font-style:italic;border-radius:999px;box-shadow:inset 0 0 0 1px #d4a24b}
.cb-card{margin-bottom:1.4rem}
.cb-card>.band .sub{display:inline;margin:0 0 0 .4rem}
.cb-head,.cb-row{display:grid;grid-template-columns:60px minmax(0,1fr) 124px 104px 54px 40px;align-items:center;column-gap:12px;padding:0 1rem}
.cb-head{font-size:.75rem;font-weight:700;color:var(--muted);padding-top:.5rem;padding-bottom:.4rem;border-bottom:2px solid #161616}
.cb-head>:nth-child(n+5),.cb-row>.n{text-align:right}
.cb-row{padding-top:.7rem;padding-bottom:.7rem;border-top:1px solid rgba(0,0,0,.45)}
.cb-t{font-size:1.45rem;font-weight:800;color:var(--cream)}.cb-t small{font-size:.75rem;font-weight:700;margin-left:2px;color:var(--muted)}
.cb-seq{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.cb-seq .cbk{font-size:.8rem;padding:.38em .5em}.cbk.dd{white-space:nowrap}
.cb-seq i{font-style:normal;color:var(--muted);font-size:.8rem}
.cb-m{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;font-weight:800;color:var(--cream);font-size:1.02rem}
.cb-bar{height:8px;border-radius:99px;background:#1c1c1c;overflow:hidden}.cb-bar b{display:block;height:100%;border-radius:99px}
.cb-row>.n{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cb-m span{font-variant-numeric:tabular-nums;min-width:2.4em;text-align:right}
.cb-item{border-top:1px solid rgba(0,0,0,.45)}
.cb-item .cb-row{border-top:0;cursor:pointer;list-style:none}
.cb-item .cb-row::-webkit-details-marker{display:none}
.cb-item .cb-row:hover{background:rgba(255,255,255,.03)}
.cb-item.hl>.cb-row{background:#463b29}
.cb-item[open]>.cb-row{background:rgba(0,0,0,.18)}.cb-item.hl[open]>.cb-row{background:#3d3324}
.cb-head+.cb-item{border-top:0}
.cb-t{position:relative}.cb-t::before{content:"";position:absolute;left:-12px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(-45deg);transition:transform .15s}
.cb-item[open] .cb-t::before{transform:translateY(-70%) rotate(45deg)}
.cb-head,.cb-row{padding-left:1.6rem}
.cb-more{padding:.4rem 1rem 1rem 1.6rem;background:rgba(0,0,0,.18)}
.cb-more .clip{margin:.4rem 0 .6rem;max-width:480px}
.cb-more p{margin:0;font-size:.95rem}
.cb-clipph{max-width:480px;aspect-ratio:16/9;margin:.4rem 0 .6rem;border:2px dashed #4a463c;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;font-style:italic;background:#1c1c1c}
.guide .cb-card .cb-cnote{margin:0;padding:.65rem 1rem .7rem 1.6rem;font-size:.92rem;color:var(--ink);max-width:none;background:var(--card-deep);border-bottom:2px solid #161616}
.guide .cb-tap{display:flex;align-items:center;gap:.5rem;color:var(--ink);font-size:.92rem;margin:.2rem 0 1.2rem}.cb-tap img{width:26px;height:26px;flex:none}
.cb-wrap .v-pi{display:none}.cb-wrap.pierce .v-pi{display:revert}.cb-wrap.pierce .v-cr{display:none}
.cb-bar b.v-pi{display:none}.cb-wrap.pierce .cb-bar b.v-pi{display:block}
.vswitch.cb-mode{padding:0;margin:0 0 .6rem}
.guide .cb-modenote{font-size:.9rem;color:var(--ink);margin:0 0 .9rem;padding:.6rem .9rem;border-left:3px solid #4a463c;background:rgba(0,0,0,.18);border-radius:0 8px 8px 0}
.cb-mode button{display:inline-flex;align-items:center;gap:.4rem}.cb-mode img{width:20px;height:20px}
.cb-mode button.pi[aria-selected="true"]{background:#26344a;border-color:#7fb2f2;color:#e3eefc}
.cb-tapin{display:flex;align-items:center;gap:.4rem;margin-top:.45rem;font-size:.8rem;font-weight:700;color:var(--amber)}.cb-tapin img{width:18px;height:18px;flex:none}
.cb-empty{padding:1rem;color:var(--muted);font-style:italic}
.cb-note{font-size:.85rem;color:var(--muted);margin:-.6rem 0 1.2rem}
.cb-row .lbl{display:none}
@media (max-width:820px){
  .cb-head{display:none}
  .cb-row{grid-template-columns:58px minmax(0,1fr);grid-template-areas:"t seq" "a a" "b b" "c d";row-gap:.55rem;padding:.8rem 14px .8rem 1.6rem}
  .cb-t{grid-area:t;font-size:1.25rem}.cb-seq{grid-area:seq}
  .cb-row>.cb-m:nth-of-type(3){grid-area:a}.cb-row>.cb-m:nth-of-type(4){grid-area:b}
  .cb-row>.n:nth-of-type(5){grid-area:c;text-align:left}.cb-row>.n:nth-of-type(6){grid-area:d;text-align:right}
  .cb-row .lbl{display:inline;font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);margin-right:.35rem}
  .cb-m{grid-template-columns:52px minmax(0,1fr) auto}
}
/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1200px;margin:0 auto}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;height:calc(100vh - 58px);overflow:auto;padding:1.5rem 1rem 2rem}
.navgroup{margin-bottom:1.4rem}
.navgroup h4{margin:0 0 .45rem .6rem;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.navgroup a{display:flex;align-items:center;gap:.55rem;padding:.4rem .6rem;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.93rem;font-weight:500;border:2px solid transparent}
.navgroup a img{width:31px;height:31px}
.navgroup a:hover{background:var(--card)}
.navgroup a[aria-current="page"]{background:var(--card);border-color:var(--edge);color:var(--cream);font-weight:700}
.navgroup a.navbuild{background:color-mix(in srgb,var(--card) 55%,transparent);border-left:4px solid var(--star);margin-bottom:.3rem}
.navgroup a.navbuild:hover{background:var(--card)}
.navgroup a.navbuild[aria-current="page"]{background:var(--card);border-color:var(--edge);border-left-color:var(--star)}
.navstar{width:26px;height:26px;flex:none;filter:drop-shadow(0 1px 0 #000)}
main{padding-block:2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view{max-width:800px;display:flex;flex-direction:column;gap:0}

/* hero: dark-to-gold header with faint ornaments (Olivier's reference: the game's weapon intro screen) */
.hero{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--shadow);margin:0 0 1.5rem;min-height:250px;display:flex;align-items:center;min-height:300px;
  background:radial-gradient(120% 140% at 95% 10%,#8a6d2c 0%,#5a4519 28%,#2e2511 55%,#16130c 80%),#16130c;color:#e7c873}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 0% 100%,rgba(0,0,0,.55),transparent 70%),repeating-radial-gradient(circle at 30% 40%,rgba(255,230,160,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.hero-art{position:absolute;left:0;top:0;height:100%;object-position:52% center;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);z-index:0;width:calc(100% - 470px);object-fit:cover}
@media (max-width:560px){.hero-art{max-width:none;width:100%;opacity:.28;-webkit-mask-image:none;mask-image:none}}
.hero .orn{position:absolute;inset:0;width:100%;height:100%;color:#d8b860}.hero::after{z-index:0}
.hero-in{position:relative;z-index:1;padding:2rem clamp(1.2rem,4vw,2.6rem);max-width:480px;margin-left:auto}
.hero .kicker{margin:0;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#d8bd7a}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(3.2rem,9vw,5rem);line-height:1;letter-spacing:.01em;color:#f6ead0;display:flex;align-items:center;gap:.9rem;margin:.3rem 0 .2rem;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero h1 img{height:.82em;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.hero .rule{display:flex;align-items:center;margin:.6rem 0 1rem}.hero .rule b{flex:1;height:1px;background:linear-gradient(90deg,rgba(241,230,204,.7),rgba(241,230,204,.35))}
.hero .rule i{width:9px;height:9px;border:1.5px solid rgba(241,230,204,.8);transform:rotate(45deg);flex:none}
.hero p{max-width:46ch;color:#e3d7bb;font-size:1rem;margin:0}
@media (max-width:560px){.hero-in{margin-left:0}.hero{min-height:220px}}

/* progression path */
.path{list-style:none;margin:0 0 .5rem;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.path a{display:flex;flex-direction:column;gap:.4rem;padding:1rem 1.1rem 1.1rem;text-decoration:none;color:var(--ink);height:100%}
.path li{position:relative}
.path .wip{position:absolute;top:1.15rem;right:1rem;display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .45rem .12rem .3rem;border-radius:999px;background:rgba(240,196,106,.1);border:1px solid rgba(240,196,106,.4);color:#f0c46a;font-size:.62rem;font-weight:700;font-style:normal;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;pointer-events:none}
.wip.inl{position:static;align-self:center;margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .45rem .12rem .3rem;border-radius:999px;background:rgba(240,196,106,.1);border:1px solid rgba(240,196,106,.4);color:#f0c46a;font-size:.62rem;font-weight:700;font-style:normal;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;white-space:nowrap}.wip.inl svg{width:11px;height:11px;flex:none}
.txt .wip.inl{margin-left:auto;font-size:.62rem;color:#f0c46a}@media (max-width:560px){.txt .wip.inl{align-self:flex-start;margin:.15rem 0 0}}
.wip svg{width:11px;height:11px;flex:none}
@media (min-width:821px){.path .wip{position:static;align-self:flex-end;margin-top:auto}}
.path a:hover{filter:brightness(1.12)}
.path strong{color:var(--cream);font-size:1.15rem}
.s-blue{--card:#2f4150}
.s-orange{--card:#4e3a2b}
.s-red{--card:#4c2f2c}
/* quest rank plate, recreated from the in-game quest list */
.path .hr,.mu-ranks .hr{align-self:flex-start;display:inline-flex;align-items:center;gap:.4rem;padding:.22rem .7rem .22rem .45rem;border-radius:6px;background:linear-gradient(180deg,#a86c3e 0%,#935a30 50%,#74401c 100%);border:2px solid #3e220c;box-shadow:inset 0 0 0 1px rgba(255,214,170,.28),inset 0 -3px 4px rgba(40,18,4,.35);color:#fff;font-weight:800;font-size:.92rem;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #2a1406,0 0 3px #2a1406}
.path .hr svg,.mu-ranks .hr svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 1px 0 #2a1406)}
.path span{color:var(--muted);font-size:.9rem}

.section-h{font-size:1.4rem;margin:2.5rem 0 .2rem}
.section-sub{color:var(--muted);margin:0 0 1rem}
.smallnote{color:var(--muted);font-size:.78rem;font-style:italic;margin:-.4rem 0 .7rem;opacity:.85}

.linklist{list-style:none;padding:0;margin:0}
.linklist li+li{border-top:2px solid var(--edge)}
.linklist a,.linklist li>div{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;text-decoration:none;color:var(--ink)}
.linklist a:hover{background:#363636}
.linklist a:hover strong{color:var(--amber)}
.linklist img{width:36px;height:36px;flex:none}
.linklist .txt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.2rem 1rem;flex:1;min-width:0}
.linklist strong{color:var(--cream);font-weight:600}
.linklist span{color:var(--muted);font-size:.92rem}
.linklist.plain .txt{flex-direction:column}

/* updates */
.updates{list-style:none;padding:0;margin:0}
.updates li{display:grid;grid-template-columns:7rem 1fr;gap:1rem;padding:.7rem 1rem}
.updates li+li{border-top:2px solid var(--edge)}
.updates time{color:var(--amber);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.updates a{color:var(--ink)}

/* placeholders */
.ph{background:var(--ph-bg);color:var(--ph);border:1px dashed var(--ph);border-radius:5px;padding:0 .35em;font-style:italic;white-space:nowrap}

/* pages */
.page-h{font-size:clamp(1.8rem,4.5vw,2.5rem);font-weight:800}
.page-lede{color:var(--muted);font-size:1.05rem;margin:.6rem 0 1.6rem;max-width:62ch}
.hi{color:var(--amber);font-weight:700}
.skip{margin-top:1rem;color:var(--amber);border-color:var(--edge)}
/* Endgame "Skip to builds": bigger, bright gold edge, sticks under the top bar while scrolling (Olivier) */
.skip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:4;align-self:flex-start;font-size:1rem;font-weight:700;padding:.6rem 1.15rem;border:2px solid #f0c46a;background:#2a2620;color:#f6d488;box-shadow:0 0 0 1px rgba(240,196,106,.35),0 0 14px rgba(240,196,106,.35),0 4px 10px rgba(0,0,0,.55)}
.abnote{margin:.6rem 1rem 0;font-size:.88rem;font-style:italic;font-weight:600;color:#f0c46a}
.skip:hover{background:#36302a;border-color:#ffd98a}
#meta-builds{scroll-margin-top:130px}
.backbtn{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1rem;width:fit-content;justify-self:start;align-self:start}
.backbtn:hover{border-color:var(--amber)}
.c-pierce{color:#7fb2f2;font-weight:700}.c-close{color:#fff;font-weight:700}.c-power{color:#ee6f69;font-weight:700}
.page-h+.banner{margin-top:1.2rem}
.banner.reco{margin-top:-.5rem}.banner.reco p{margin:.4rem 0 0;max-width:68ch}
.banner{background:var(--card);border:2px solid var(--edge);border-left:5px solid var(--amber);padding:.7rem 1rem;border-radius:10px;margin:0 0 1rem;font-size:.95rem}

/* build cards */
.build{margin:0 0 1.5rem}
.build .band{justify-content:space-between;flex-wrap:wrap}
.fold>summary{cursor:pointer;list-style:none;justify-content:flex-start}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .bname{flex:1}
.fold>summary:hover{filter:brightness(1.15)}
.fold:not([open])>summary{border-bottom:0}
.chev{width:.6rem;height:.6rem;border-right:3px solid var(--amber);border-bottom:3px solid var(--amber);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:.2rem}
.fold[open] .chev{transform:rotate(45deg)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:flex-end;margin-left:auto}
.tag.settag{color:var(--c);border-color:color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.tag{font-size:.8rem;font-weight:600;color:var(--amber);border:2px solid var(--amber);border-radius:999px;padding:.05rem .65rem}

  endgame:{ group:"Builds", title:"Endgame", desc:"Gogma Artian bows and meta builds", html:()=>`
    <div class="mu-ranks pagerank">${rank("#dc3a2c","HR 100+")}</div>
    <h1 class="page-h">Endgame</h1>
    <button class="iconbtn skip" data-scroll="meta-builds">Skip to builds <span aria-hidden="true">↓</span></button>
    <div class="guide">
      <h2>Gogma Artian bows</h2>
      <p>With the addition of <strong class="hi">Gogmazios</strong> bows, we now have an upgrade to the Artian bows. By choosing the Focus of the weapon, you can now select your main coating.</p>
      <p><strong class="c-pierce">Pierce Coatings</strong> since the TU4 buffs are now the most dominant coatings for the majority of endgame fights.<br>
      <strong class="c-close">Close range Coatings</strong> are best for matchups where pierce doesn't work well.<br>
      <strong class="c-power">Power coatings</strong> were already struggling, but since Affinity Focus is the worst tradeoff, they maintain their position of worst coating.</p>
      <p>Refer to <a href="#matchups">matchup page</a> for more info</p>
      <img class="figure" style="max-width:528px" src="img/tarred_devices.webp" alt="Tarred Device tradeoffs. Attack Focus, Close Range Coatings: +10 Raw, -15% Aff. Affinity Focus, Power Coatings: +10% Aff, -10 Raw, -20 Ele. Element Focus, Pierce Coatings: +30 Ele, -5% Aff." loading="lazy">

      <h2>Ideal reinforcements</h2>
      <p class="banner">These ideal reinforcements are a guideline. Try to get as close as possible, but small variations are OK.</p>
      <p>The ideal reinforcements depend on the build and the charm, but generally:</p>
      <div class="reinf"><section class="card"><h3 class="band">Craftable charms</h3><p class="rnote">For most builds and matchups, the <strong class="hi">Overall Best</strong> reinforcements are as follows:</p><div class="rrow a x2"><div class="ric"><img src="img/reinf/r_atk_ex.webp" alt=""></div><b class="max">Attack EX</b><span>×2</span><em class="max">+12</em></div><div class="rrow a"><div class="ric"><img src="img/reinf/r_atk.webp" alt=""></div><b>Attack III</b><span></span><em>+9</em></div><div class="rrow e x2"><div class="ric"><img src="img/reinf/r_ele_ex.webp" alt=""></div><b class="max">Element EX</b><span>×2</span><em class="max">+60</em></div></section><section class="card"><h3 class="band">God charms</h3><p class="rnote">The additional point in <strong class="k-jewel">Critical Boost</strong>, along with the higher <strong class="k-aff">affinity</strong> from the addition of <strong class="k-jewel">Critical Eye III</strong>, makes the <strong class="k-aff">Affinity EX</strong> reinforcement superior to <strong class="k-atk">Attack III</strong>.</p><div class="rrow a x2"><div class="ric"><img src="img/reinf/r_atk_ex.webp" alt=""></div><b class="max">Attack EX</b><span>×2</span><em class="max">+12</em></div><div class="rrow f"><div class="ric"><img src="img/reinf/r_aff_ex.webp" alt=""></div><b class="max">Affinity EX</b><span></span><em class="max">+10%</em></div><div class="rrow e x2"><div class="ric"><img src="img/reinf/r_ele_ex.webp" alt=""></div><b class="max">Element EX</b><span>×2</span><em class="max">+60</em></div></section></div>
      <p class="banner">For <strong class="hi">Gogmazios 4P</strong> builds specifically, make sure to have two <strong class="hi">Element EX</strong>. Otherwise, you will hit the element cap and some of your element skills will be wasted.</p>
      <div class="reinf"><section class="card"><h3 class="band">Anti-AT Arkveld builds</h3><p class="rnote">While element is decent on his wings, this is still largely a <strong class="k-raw">Raw Matchup</strong>, so element is a low priority for the reinforcements.</p><div class="rrow a x2"><div class="ric"><img src="img/reinf/r_atk_ex.webp" alt=""></div><b class="max">Attack EX</b><span>×2</span><em class="max">+12</em></div><div class="rrow a x2"><div class="ric"><img src="img/reinf/r_atk.webp" alt=""></div><b>Attack III</b><span>×2</span><em>+9</em></div><div class="rrow f"><div class="ric"><img src="img/reinf/r_aff_ex.webp" alt=""></div><b class="max">Affinity EX</b><span></span><em class="max">+10%</em></div></section></div>

      <h2>RNG charms</h2>
      <p>RNG charms are a small damage upgrade, usually around 2%, give or take. They can also be quite comfortable thanks to the extra armor decoration slots, which make it easy to fit more <strong class="hi">Constitution</strong>.</p>
      <p>In the picture below, the <strong style="color:#7fd19a">green skills</strong> are usually the best, but any skill combination shown is acceptable.</p>
      <img class="figure" style="max-width:480px" src="img/golden_age_charm.webp" alt="Golden Age Charm (God Charm) options. Weapon skill, one of: Spread/Power Shots 1, Critical Eye 3 (best), Charge Master 3, Attack Boost 3. Armor skill, one of: Agitator 1, Weakness Exploit 1 (best), Adrenaline Rush 1, Burst 1. Slots: Critical plus two optional." loading="lazy">
      <p>In the builds, each <strong class="hi">God Charm</strong> version shows a specific God Charm. If yours is a little different, you can still use the same build, but you'll have to shuffle the decorations around to keep the same skills.</p>

      <h2>Which build for you?</h2>
      <p>Comparing the damage of the three builds on a 45 raw hitzone, across a range of elemental hitzones: the higher the elemental hitzone, the better <strong class="hi">Gogmazios 4P</strong> performs.</p>
      <p><strong class="hi">Gore Magala</strong> and <strong class="hi">Gore/Soul</strong> benefit more from a God Charm, because they keep <strong style="color:#e8b4ae">Agitator 5</strong> while Gogmazios 4P can't. With a God Charm, Gore/Soul also does better than Gore Magala: it keeps <strong style="color:#e8b4ae">Peak Performance</strong> at level 4 in both versions, while Gore Magala has to drop from 5 to 4. While Gore/Soul does better, this is calculated for very high DPS uptime: average or newer players will see more benefit from <strong class="hi">Scorcher</strong>.</p>
      <p>Additionally, the Gore builds are infinitely easier to grind for.</p>
      <p>The only difference in skill uptime: <strong style="color:#e8b4ae">Peak Performance</strong> uptime is assumed around 80% on Gogmazios 4P, and 50% on the other builds because they don't benefit from the Gogmazios shield.</p>
    </div>
    <section class="card build dmg">
      <div class="band"><span>Damage by elemental hitzone</span></div>
      <div class="vswitch" role="tablist" aria-label="Charm"><button type="button" role="tab" aria-selected="true" data-variant="0">Craftable charm</button><button type="button" role="tab" aria-selected="false" data-variant="1" class="god">God Charm</button></div>
      <div class="legend">${DMG_B.map(([n,c])=>`<span style="--c:${c}"><i></i>${n}</span>`).join("")}</div>

      <p>If you're looking for the absolute best damage, the <strong class="hi">Gore</strong> builds are generally better. <strong class="hi">Gore/Soul</strong> is even slightly better if you have high DPS, but the RNG is difficult: it requires both a God Charm and Lord's Soul + Gore Magala on the weapon.</p></div>

  basics:{ group:"Guides", icon:"bow_basics", title:"Bow Basics", desc:"Bow core moveset", html:()=>`
    <article class="guide">
      <h1 class="page-h">Bow Basics</h1>
      <p class="page-lede">The goal of Bow is to get to max charge as fast as possible and stay there as long as possible, while using as many Power Shots and Power Volleys as you can.</p>
      ${controlsCard()}
      <h2>Charge levels</h2>
      <p>Bow has three charge levels. Level 1 is uncharged, and each level above it makes your shots stronger.</p>
      <div class="charge c3">
        <div class="card lv1">${cdots(0)}<b>Level 1</b>Uncharged</div>
        <div class="card lv2">${cdots(1)}<b>Level 2</b>Half charge</div>
        <div class="card lv3">${cdots(2)}<b>Level 3</b>Max charge</div>
      </div>
      <h2>Ramping up</h2>
      <p>Getting to max charge is usually referred to as <strong class="hi">ramping up</strong>. There are 3 ways to ramp up:</p>
      <ol>
        <li><strong>Discerning Dodge.</strong> The most efficient way is to counter an attack with your <strong class="hi">Discerning Dodge</strong>. It instantly gives you <strong class="hi">Max Charge</strong> and <strong class="hi">full stamina</strong>. More on this later.<video class="clip" src="vid/discerning_dodge.mp4?v=2" poster="vid/discerning_dodge_poster.jpg?v=2" autoplay muted loop playsinline aria-label="Discerning Dodge clip: dodging into an attack to instantly reach max charge"></video></li>
        <li><strong>Charged Shots.</strong> Each Charged Shot increases your charge level by 1 after firing. This is called a <strong class="hi">Manual Ramp-up</strong>.<video class="clip" src="vid/charged_shot_rampup.mp4" poster="vid/charged_shot_rampup_poster.jpg" autoplay muted loop playsinline aria-label="Manual ramp-up clip: two Charged Shots take you from level 1 to level 2, then level 3, followed by Power Shot and Power Volley"></video></li>
        <li><strong>Hold your arrow.</strong> Holding gradually increases your charge level (faster if you’re stationary). This is very rarely used.</li>
      </ol>
      <p>There are other variations of the Manual Ramp-up combos, detailed in the <a href="#combos">Advanced Combos</a> page.</p>
      <p class="banner">Your other moves, like <strong class="hi">Power Shot</strong> and <strong class="hi">Thousand Dragons</strong>, don’t increase your charge level. They keep and use your current charge level.</p>
      <h2 id="max-charge">Staying at Max Charge Level</h2>
      <p>Once at max charge, you can maintain your charge level by using <strong class="hi">Power Shots</strong> and <strong class="hi">Power Volleys</strong>, which are your most damaging moves, so you need to use them as much as possible.</p>
      <p>After that, your only option to maintain your charge level is to <strong class="hi">dash</strong>. Dashing doesn’t increase your charge level, but it maintains your current one.</p>
      <p>This loop is known as <strong class="hi">dash dancing</strong>:</p>
      <video class="clip" src="vid/dash_dancing_combo.mp4?v=2" poster="vid/dash_dancing_combo_poster.jpg?v=2" autoplay muted loop playsinline aria-label="Dash dancing clip: ramp up to level 3, then loop Power Shot, Power Volley and dash while staying at max charge"></video>
      <p class="clipnote">There are variations of the dash dance combo, detailed in the <a href="#combos">Advanced Combos</a> page.</p>
      <p>Dash dancing is one of your highest DPS combos. Sometimes you’ll have to break the loop:</p>
      <ol>
        <li>to avoid the monster’s attacks,</li>
        <li>because you’re running out of <strong class="hi">stamina</strong>,</li>
        <li>or because you’re running out of <strong class="hi">coatings</strong>.</li>
      </ol>
      <h2>Managing your Coatings</h2>
      <p>In Wilds, the way coatings work has changed. They went from <strong class="hi">limited and craftable</strong> to <strong class="hi">unlimited</strong>, using the <strong class="hi">Trick Arrow gauge</strong> instead.</p>
      <p>The drawback is that you have to reload very frequently, because you can only load <strong class="hi">10 coatings at a time</strong>. When doing combos, keep track of how many coatings you have left so you don't end up shooting without any.</p>
      <img class="coat-ammo" src="img/coat_ammo.webp?v=2" alt="Coating menu showing Pierce Coating 10/10">
      <p class="clipnote">For a full list of all coatings, <a href="#stamina/coatings">click here</a>.</p>
      <p>By default, reloading your coatings <strong class="hi">drops your charge level</strong>.</p>
      <p>Because the reload animation is so fast, the most efficient time to reload is <strong class="hi">right before a monster is about to hit you</strong>. That way you reload, then instantly get back to max charge with a Discerning Dodge.</p>
      <p>If you have to reload but there is no occasion for a Discerning Dodge, for example when the monster is toppled, you will have to do a <strong class="hi">Manual Ramp-up</strong>.</p>
      <p class="banner"><strong class="hi">Advanced tip:</strong> you can maintain your charge level while reloading after a Discerning Dodge by holding your charge button and letting go of the aim button.</p>
      <video class="clip" src="vid/reload_keep_charge.mp4" poster="vid/reload_keep_charge.jpg" autoplay muted loop playsinline></video>
      <h2 id="discerning-dodge">Discerning Dodge</h2>
      <p>The Discerning Dodge is your <strong class="hi">best defensive tool</strong>. It has both <strong class="hi">i-frames</strong> and <strong class="hi">counter frames</strong>.</p>
      <p class="clipnote">If you want to learn more about how Evade Window interacts with those i-frames and counter frames, <a href="#skills/evade-window">click here</a>.</p>
      <p>If you dodge through an attack, your counter frames <strong class="hi">nullify the attack completely</strong>. Not only that, but it also gets you to <strong class="hi">max charge level instantly</strong>, gives you your <strong class="hi">stamina back</strong> and refills some of <strong class="hi">the resource gauge</strong>.</p>
      <video class="clip" src="vid/dodge_gauge.mp4" poster="vid/dodge_gauge.jpg" autoplay muted loop playsinline></video>
      <p>The amount of stamina and Trick Arrow gauge you get back depends on your <strong class="hi">dodge timing</strong>. By default, the counter window lasts <strong class="hi">14 frames</strong>.</p>
      <div class="cframes">
        <div class="cf-bar"><span class="cf-a">Perfect counter</span><span class="cf-b">Counter</span></div>
        <div class="cf-scale"><span>Frames 1–7</span><span>Frames 8–14</span></div>
      </div>
      <p class="clipnote">For more information about Discerning Dodge evade frames, <a href="#stamina">click here</a>.</p>
      <p>If you dodge with <strong class="hi">perfect timing</strong>, you get full stamina and a lot of Trick Arrow gauge. If you dodge without perfect timing, you get only a little bit of stamina and Trick Arrow gauge.</p>
      <p>After a counter, you get a <strong class="hi">full second of hyper armor</strong>.</p>
      <h2 id="trick-arrow-gauge">Trick Arrow Gauge</h2>
      <p>Wilds adds the <strong class="hi">Trick Arrow gauge</strong>. For now, in the base game, it is only used for two things:</p>
      <ol>
        <li>Creating <strong class="hi">coatings</strong></li>
        <li>Making a <strong class="hi">Tracer Arrow</strong></li>
      </ol>
      <img class="coat-ammo" src="img/trick_gauge2.webp" alt="Trick Arrow gauge" style="max-width:360px">
      <p>Coatings are <strong class="hi">very cheap</strong>. We'll talk about Tracer in the <a href="#focus-mode/tracer">Additional Moves</a> page, but Tracers are not used very often.</p>
      <p>You generate Trick Arrow gauge by doing damage, holding an arrow, or most importantly, by doing a <strong class="hi">Discerning Dodge</strong>.</p>
      <div class="banner reco" style="margin-top:1.6rem"><strong class="hi">The bread and butter of Bow</strong>
        <p>This page covered only the core moveset of Bow. If that's all you use, you'll be able to comfortably clear any content in the game.</p>
        <p>However, Bow has additional moves that can enhance your gameplay. We'll talk about them in detail on the <a href="#focus-mode">Additional Moves</a> page.</p>
      </div>
    </article>
  `},
  combos:{ group:"Guides", icon:"combos", title:"Advanced Combos", desc:"Optimize your combos", html:()=>`
    <article class="guide">
      <h1 class="page-h">Advanced Combos</h1>
      <p>If you want a quick video overview of combo optimization, watch this video: ${yt("https://www.youtube.com/watch?v=LWDhcFlNvTs&t=174s","Bow combo optimization")}</p>
      <p>In every damage window, use the <strong class="hi">longest combo that fits</strong>. If several fit, pick the one with the <strong class="hi">highest MV/s</strong> (motion value per second).</p>
      <p>Below are the most commonly used combos. For each one, the table shows its duration, total motion value (MV) and elemental motion value (eMV), and the resulting <strong class="hi">MV/s</strong> and <strong class="hi">eMV/s</strong>. A motion value is the base strength of an attack, before any outside factors.</p>
      <div class="cb-wrap">
      <div class="vswitch cb-mode" role="tablist" aria-label="Coating type"><button type="button" role="tab" aria-selected="true" data-cbmode="cr"><img src="img/coat/close.webp" alt="">Close Range / Power</button><button type="button" role="tab" aria-selected="false" data-cbmode="pi" class="pi"><img src="img/coat/pierce.webp" alt="">Pierce</button></div>
      <p class="cb-modenote">The best combo choices are the <strong class="hi">same for every coating</strong>. Two things to keep in mind: <strong class="c-close">Close Range</strong> and <strong class="c-power">Power</strong> Coatings add a <strong class="hi">raw modifier</strong> that isn’t included in these numbers, and with <strong class="c-pierce">Pierce</strong>, Thousand Dragons combos deal <strong class="hi">much more elemental damage</strong>.</p>
      <div class="cb-legend"><span><b class="cbk">CS</b>Charged Shot</span><span><b class="cbk">PS</b>Power Shot</span><span><b class="cbk">PV</b>Power Volley</span><span><b class="cbk td">TD</b>Thousand Dragons</span></div>
      ${cbTable("Ramp up combo", CB_RAMP, "ramp-up", `The best way to ramp up is a <a href="#basics/discerning-dodge">Discerning Dodge</a> that counters an attack (see <a href="#basics">Bow Basics</a>). When that isn’t an option, you have to <strong class="hi">ramp up manually</strong>: that’s what these combos are for.`)}
      ${cbTable("Dash dance combos", CB_DD, "dash-dance", `The <a href="#basics/max-charge">dash dance</a> is the Bow’s <strong class="hi">bread and butter</strong> combo. It’s also very <strong class="hi">flexible</strong>: depending on the opening, you can adjust it to fit the window better.`)}
      ${cbTable("TD combos", CB_TD, "td-combos", `<a href="#focus-mode/thousand-dragons">Thousand Dragons</a> is best used as a <strong class="hi">combo extender</strong>. It can be difficult to use because it needs strict <strong class="hi">positioning, distance and timing</strong>, but when you work it in correctly, it gives you the <strong class="hi">highest DPS combos</strong>.`)}
      </div>
    </article>
  `},
  "focus-mode":{ group:"Guides", icon:"add_moves4", title:"Additional Moves", desc:"All extra moves", html:()=>`
    <article class="guide">
      <h1 class="page-h">Additional Moves</h1>

      <h2 id="hailstorm">Focus Strike: Hailstorm</h2>
      <p>Like every weapon, Bow has a Focus Strike to target and destroy wounds. Unlike most weapons, it has <strong class="hi">no real utility</strong>: it only does damage and fills a bit of your <a href="#basics/trick-arrow-gauge">Trick Arrow Gauge</a>.</p>
      <video class="clip" src="vid/focus_strike.mp4" poster="vid/focus_strike_poster.jpg" autoplay muted loop playsinline aria-label="Focus Strike: Hailstorm clip on a training target, locking on and destroying wounds"></video>
      <p>For most of the game it’s <strong class="hi">not worth using</strong>, and in multiplayer other weapons get more out of theirs. In endgame against <strong class="hi">9 and 10 star monsters</strong> it becomes very relevant, because its damage <strong class="hi">scales on the monster’s health</strong>.</p>
      <img class="shot" src="img/multi_wound_break.webp" width="450" height="239" alt="Four wounds broken at once with a Focus Strike, each break dealing thousands of damage" loading="lazy">
      <p>For some reason, Bow does <strong class="hi">more wound break damage</strong> than any other weapon, and it scales higher for each wound you break at once, up to 4. On 10 star monsters a 4-wound break is <strong class="hi">ridiculous</strong> in solo, and even more so in multiplayer.</p>
      <p>Locking on to 4 wounds one by one is slow, so use the <a href="#focus-mode/arc-shot">instant wound lock</a> tech from the Arc Shot section.</p>
      <p class="banner"><strong class="hi">Pro tip:</strong> Focus Strike can also be used to activate environmental traps.</p>
      <video class="clip" src="vid/focus_strike_trap.mp4" poster="vid/focus_strike_trap_poster.jpg" autoplay muted loop playsinline aria-label="Focus Strike activating an environmental trap"></video>

      <h2 id="thousand-dragons">Thousand Dragons</h2>
      <p>A slow, point-blank attack that hits <strong class="hi">very hard</strong>, but only connects if you’re right next to the monster.</p>
      <p>Its long recovery can be cancelled surprisingly early with a Focus Strike or, better, a dash.</p>
      <video class="clip wide" src="vid/thousand_dragons_compare.mp4" poster="vid/thousand_dragons_compare_poster.jpg" autoplay muted loop playsinline aria-label="Thousand Dragons side by side: default recovery on the left, dash cancel on the right"></video>
      <p>Damage is the <strong class="hi">same at any charge level</strong>, and it keeps your current charge level, so dashing out of it leaves your charge intact.</p>
      <p>This move can be difficult to use because it requires <strong class="hi">perfect positioning</strong> and is pretty slow. When used as a <strong class="hi">combo extender</strong>, it has very high DPS. <a href="#combos">Click here to see more</a>.</p>
      <p>It’s <strong class="hi">not buffed by Spread/Power Shots</strong>. Instead, it’s buffed by Piercing Shots or Special Ammo Boost. <a href="#skills/weapon-skills">Click here for more details on those skills</a>.</p>

      <h2 id="swallow-shot">Flying Swallow Shot</h2>
      <p>New to Wilds, this is a leap that fires a Power Shot in the air. It’s an <strong class="hi">amazing movement tool</strong>.</p>
      <video class="clip" src="vid/swallow_shot.mp4" poster="vid/swallow_shot_poster.jpg" autoplay muted loop playsinline aria-label="Flying Swallow Shot clip: leaping and firing a Power Shot in the air"></video>
      <p>While the DPS of Flying Swallow Shot combos is lower than a regular <a href="#basics/max-charge">dash dance</a>, it’s an <strong class="hi">essential tool for repositioning</strong>.</p>
      <p>Additionally, Flying Swallow Shot can be used to <strong class="hi">jump over small ledges</strong> without interrupting your combo.</p>
      <video class="clip" src="vid/swallow_ledge.mp4" poster="vid/swallow_ledge_poster.jpg" autoplay muted loop playsinline aria-label="Flying Swallow Shot clip: jumping over a small ledge mid-combo"></video>
      <p>Flying Swallow Shot is not buffed by Spread/Power Shots.</p>

      <h2 id="arc-shot">Arc Shot</h2>
      <p>Arc Shot fires a rain of arrows that deals light damage and <strong class="hi">embeds fuses</strong> in the monster. Holding it builds your charge level while your stamina recovers.</p>
      <video class="clip" src="vid/arc_shot.mp4" poster="vid/arc_shot_poster.jpg" autoplay muted loop playsinline aria-label="Arc Shot clip: a rain of arrows embedding fuses in the monster"></video>
      <p>Its damage is too low to matter most of the time. What makes it worth learning is the <strong class="hi">instant wound lock tech</strong>.</p>
      <p>Normally, Focus Strike locks onto wounds one at a time. With this tech, it <strong class="hi">locks onto up to 4 wounds at once</strong>.</p>
      <video class="clip wide" src="vid/wound_lock_compare.mp4" poster="vid/wound_lock_compare_poster.jpg" autoplay muted loop playsinline aria-label="Side-by-side: normal Focus Strike lock-on versus the instant wound lock tech"></video>
      <p>You need <strong class="hi">at least 4 fuses</strong> in the monster. When you Focus Strike, keep both the wounds and the fuses inside the reticle, and every wound locks at once. A <strong class="hi">level 3 Arc Shot fires exactly 4 fuses</strong>, so one is all it takes.</p>
      <p>You can fire a level 3 Arc Shot straight out of a Discerning Dodge, but the timing is finicky: <strong class="hi">wait a split second</strong> or you'll get a Power Shot instead.</p>
      <p>It takes some practice, but it's worth it. The best moment to fire the Arc Shot is during an <strong class="hi">attack you can't punish</strong>. For a deeper look at the tech, watch this video: ${yt("https://www.youtube.com/watch?v=jdYF51kyBHc&t=5s","Instant wound lock tech")}</p>
      <p class="banner"><strong>Note:</strong> In rare situations, Arc Shot can build your charge level while you're completely out of stamina, and regenerate some stamina at the same time.</p>

      <h2 id="tracer">Tracer Arrow</h2>
      <p>Placing a Tracer Arrow on a monster makes <strong class="hi">all following shots track to it</strong>. This helps players who aren't confident in their aim, but often <strong class="hi">causes missed shots</strong> when the monster moves or is at an odd angle.</p>
      <video class="clip" src="vid/tracer.mp4" poster="vid/tracer_poster.jpg" autoplay muted loop playsinline aria-label="Tracer Arrow clip: shots tracking to the placed tracer"></video>
      <p>On the plus side, it <strong class="hi">extends your critical range</strong> so you can play from further away, helps with <strong class="hi">small weak spots</strong>, and shots always count as max charged, so there's no ramp up.</p>
      <p>Applying it costs a lot of Trick Arrow Gauge and time, so it's <strong class="hi">always a DPS loss</strong>. In most situations, treat it as a <strong class="hi">comfort option</strong>.</p>
      <p>On Pierce, it <strong class="hi">slows the tick rate</strong> (though each tick hits much harder) and can mess with the pierce lines. It's generally not advised, except on oddly shaped hitzones like Gogmazios's wings.</p>
      <video class="clip" src="vid/tracer_gogmazios.mp4" poster="vid/tracer_gogmazios_poster.jpg" autoplay muted loop playsinline aria-label="Tracer Arrow on Pierce against Gogmazios's wings"></video>

      <h2 id="dragon-piercer">Dragon Piercer</h2>
      <p>A slow, stationary move that fires one arrow piercing through the monster. Used right after a dash or an attack, it becomes the <strong class="hi">Instant Dragon Piercer</strong>: about <strong class="hi">30% faster</strong>, for about 30% less damage.</p>
      <video class="clip wide" src="vid/dragon_piercer_compare.mp4" poster="vid/dragon_piercer_compare_poster.jpg" autoplay muted loop playsinline aria-label="Side-by-side: regular Dragon Piercer (DP) versus Instant Dragon Piercer (iDP) animation speed"></video>
      <p>In Wilds, it uses sever hitzones instead of shot hitzones, and takes on your coating: <strong class="c-close">Close Range</strong> and <strong class="c-power">Power</strong> raise its raw damage, <strong class="c-pierce">Pierce</strong> raises its tick rate.</p>
      <p>It was briefly relevant at launch, but got nerfed and is now <strong class="hi">never used</strong>.</p>
      <p class="banner"><strong>Note:</strong> Focus Strike looks like a Dragon Piercer, but it's a separate attack and doesn't inherit its properties.</p>

    </article>
  `},
  stamina:{ group:"Guides", icon:"stamina_combo", title:"Additional Information", desc:"Stamina cap, coatings and 40 FPS", html:()=>`
    <article class="guide">
      <h1 class="page-h">Additional Information</h1>
      <p class="page-lede">Stamina is bow’s most important resource. Any of these six combinations caps your stamina reduction.</p>
      <div class="card t-tan tablewrap fitw"><table>
        <thead><tr><th class="c1">Constitution</th><th>Items needed</th></tr></thead>
        <tbody>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(5,5)}</span></td><td></td></tr>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(4,5)}<span class="tplus">+</span></span></td><td><span class="plus-items"><img class="tico" src="img/dash_juice2.webp" alt="">Dash Juice</span></td></tr>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(3,5)}<span class="tplus">+</span></span></td><td><span class="plus-items"><img class="tico" src="img/black_belt_lo2.webp" alt="">Black Belt (Lo)</span></td></tr>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(2,5)}<span class="tplus">+</span></span></td><td><span class="plus-items"><img class="tico" src="img/dash_juice2.webp" alt="">Dash Juice + <img class="tico" src="img/black_belt_lo2.webp" alt="">Black Belt (Lo)</span></td></tr>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(2,5)}<span class="tplus">+</span></span></td><td><span class="plus-items"><img class="tico" src="img/black_belt_hi.webp" alt="">Black Belt (Hi)</span></td></tr>
          <tr><td class="c1"><span class="con"><img class="tico" src="img/stamina.webp" alt="">${pips(1,5)}<span class="tplus">+</span></span></td><td><span class="plus-items"><img class="tico" src="img/dash_juice2.webp" alt="">Dash Juice + <img class="tico" src="img/black_belt_hi.webp" alt="">Black Belt (Hi)</span></td></tr>
        </tbody>
      </table>
        <div class="pip-legend"><span><span class="pips"><i></i></span>Constitution level</span><span class="con"><span class="pips"><i class="e"></i></span>From items, counts as a level</span></div>
      </div>
      <p>Constitution 5 is easy to slot with jewels on current sets, but use any row if you need your level 1 slots elsewhere.</p>

      <h2 id="coatings">Coatings</h2>
      <div class="coat-grid">
      ${card("Close-Range Coating","coat/close","t-grey",`<ul class="cpts"><li class="pro"><strong>40%</strong> extra raw damage</li><li class="pro">No penalty at close range</li><li class="con">Shorter range</li></ul>`)}
      ${card("Power Coating","coat/power","t-red",`<ul class="cpts"><li class="pro"><strong>35%</strong> additional raw damage</li><li class="pro">Long critical range</li><li class="con">Penalty at close range</li></ul>`)}
      ${card("Pierce Coating","coat/pierce","t-blue",`<ul class="cpts"><li class="pro">Multiple instances of damage per arrow</li><li class="pro">Long critical range</li><li class="con">Penalty at close range</li><li class="neu">No raw modifier</li></ul>`)}
      ${card("Status Coatings","coat/paralysis","t-purple",`<div class="st-icons"><img src="img/coat/paralysis.webp" alt="paralysis" title="Paralysis"><img src="img/coat/poison.webp" alt="poison" title="Poison"><img src="img/coat/sleep.webp" alt="sleep" title="Sleep"><img src="img/coat/blast.webp" alt="blast" title="Blast"><img src="img/coat/exhaust.webp" alt="exhaust" title="Exhaust"></div><ul class="cpts"><li class="pro">Applies a small amount of the coating’s status</li><li class="con">Removes your bow’s element</li><li class="neu">No raw modifier</li></ul>`)}
      </div>
      <p><strong class="c-power">Power Coating</strong> is generally considered the worst coating for damage.</p>
      <p><strong class="c-pierce">Pierce Coating</strong> is generally the best for endgame, but needs a monster that is compatible with Pierce. The monster's shape and hitzones need to allow Pierce Coating to do multiple ticks of damage on good hitzones.</p>
      <p>Whenever Pierce Coating is not suitable, <strong class="c-close">Close-Range Coating</strong> becomes the best coating.</p>
      <p class="clipnote"><a href="#matchups">Click here</a> to see a match-up chart of Close-Range Coating versus Pierce Coating.</p>
      <h2 id="40-fps">40 FPS</h2>
      <p>As in many other Capcom games, a lot of things are tied to FPS. In Wilds, it’s usually pierce attacks, so for Bow this affects <strong class="c-pierce">Pierce Coatings</strong>.</p><p>If you lock your FPS at <strong class="hi">exactly 40</strong>, you increase the tick rate of Pierce Coatings, which increases their damage by <strong class="hi">around 20%</strong> (estimate). If you want to learn more, you can check out ${yt("https://youtu.be/kQcXS3EWRQA","this video")}.</p><p>Even without the FPS lock, Pierce Bow is extremely strong, so do not feel that you have to use this.</p>
      <p class="banner"><strong>Frame gen does not affect this</strong>, so you can play at 40 FPS with frame gen X2 or X3 to get smoother frames.</p>
    </article>
  `},

  skills:{ group:"Resources", icon:"skills", title:"Skill Notes", desc:"Gogmapocalypse, Tetrad Shot, Charge Master, Counterstrike and more", html:()=>`
    <h1 class="page-h">Skill Notes</h1>
    <p class="page-lede">How the skills that matter for bow actually behave.</p>
    <details class="sec"><summary><span class="chev" aria-hidden="true"></span><img class="secico" src="img/set_bonus.webp" alt=""><h2>Set Bonus and Group Skills</h2></summary>
    <div class="skills">
      ${scard(`Gogmapocalypse (2p)<small class="sub">Mutual Hostility I</small>`,"set_bonus","st-gogma",`<div class="fx" style="--sc:#d9b25a">${FX_RAGE}<div class="fx-stats">${fxStat("element","+20%","of base element")}${fxStat("element","+20","flat element")}</div></div>`)}
      ${scard(`Gogmapocalypse (4p)<small class="sub">Mutual Hostility II</small>`,"set_bonus","st-gogma",`<div class="fx" style="--sc:#d9b25a">${FX_RAGE}<div class="fx-stats">${fxStat("element","+30%","of base element")}${fxStat("element","+40","flat element")}</div>
        <div class="fx-tl"><div class="fx-bar"><span class="fx-on">Barrier up · 2:20</span><span class="fx-off">0:30</span></div><div class="fx-scale"><span>Monster enrages</span><span>Cooldown 2:50</span></div></div>
        <ul class="fx-perks"><li>Absorbs 75 damage</li><li>A bigger hit is fully absorbed</li><li>Triggers Counterstrike and Elemental Absorption</li><li>Immune to status ailments</li></ul></div>
        <p>The barrier lasts until it absorbs 75 damage or for 2:20. On a permanently enraged monster you spend 30 seconds without it.</p>`,"mutual-hostility-2")}
      ${scard(`Gore Magala’s Tyranny (2/4p)<small class="sub">Black Eclipse</small>`,"set_bonus","st-gore",`<p><strong style="color:#c9a8e6">Black Eclipse I</strong> gives Frenzy, which grants <strong class="hi">+15% affinity</strong> when cured (+10% with Antivirus 3).</p><p style="padding-top:0"><strong style="color:#c9a8e6">Black Eclipse II</strong> gives <strong class="hi">+10 raw</strong>, and an additional <strong class="hi">+5</strong> when Frenzy is cured.</p>`)}
      ${scard(`Rathalos’s Flare (2/4p)<small class="sub">Scorcher</small>`,"set_bonus","st-scorch",`<p>Uncommonly adds a tick of fire damage while attacking: <strong class="hi">Fire hitzone × 0.6 + 20</strong> in High Rank (× 1.2 + 40 with 4 pieces). Scales with Fire Attack and other element multipliers.</p><p style="padding-top:0"><strong class="hi">Note:</strong> Scorcher is a <strong class="hi">skill critical</strong>: it only triggers on attacks tagged as skill critical. On Bow, that’s almost every attack. The exception is <strong class="c-pierce">Pierce</strong>: its Power Shots and Power Volley can’t trigger Scorcher.</p>`)}
      ${scard(`Ebony Odogaron’s Power (2/4p)<small class="sub">Burst Boost</small>`,"set_bonus","st-burst",`<p>Extends the duration of <strong class="hi">Burst</strong> and grants <strong class="hi">+8 attack</strong> while Burst is active (+18 and a longer duration with 4 pieces).</p>`)}
      ${scard(`Lord’s Soul<small class="sub">Guts (Tenacity)</small>`,"group_skill","st-lord",`<p><strong style="color:#d8c7a3">Guts</strong> prevents 1 fatal hit per cart, leaving you at 1 HP.</p><p style="padding-top:0">As long as Guts is still active, you gain <strong class="hi">+5% base raw</strong>.</p>`)}
    </div></details>
    <details class="sec" id="weapon-skills"><summary><span class="chev" aria-hidden="true"></span><img class="secico" src="img/weapon_bow.webp" alt=""><h2>Weapon Skills</h2></summary>
    <div class="skills">
      ${scard("Elemental Attack","element","dk-indigo",`<p>Increases element attack power. (Elemental attack power has a maximum limit.)</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> +40 Element<br><strong class="hi">Lv 2:</strong> x1.1 Element and +50 Element<br><strong class="hi">Lv 3:</strong> x1.2 Element and +60 Element</p>`)}
      ${scard("Tetrad Shot","spread_power_shots","dk-lblue",`<p>Buffs your coating shots once you reach the <strong class="hi">4th shot</strong> of a load. <strong class="hi">Don’t reload early</strong> if you want full value.</p><div class="tet-row"><div class="lvg l3 tet"><span></span>${[1,2,3].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Affinity<small>4th to 10th shot</small></span>${[8,10,12].map(v=>`<em>+${v}%</em>`).join("")}<span class="k">Attack<small>4th and 6th shot</small></span>${[3,6,10].map(v=>`<em>+${v}</em>`).join("")}<span class="k">Element<small>4th and 6th shot</small></span>${[5,5,5].map(v=>`<em>+${v}%</em>`).join("")}</div><div class="fx tet-fx">${tetradUI()}</div></div><div class="deco-note"><span class="deco-row"><img src="img/deco3_water.webp" alt="Level 3 Element/Bandolier jewel"></span><p>This is a <strong class="hi">frontloaded skill</strong>, meaning the first point brings most of the value. Since it comes as a bonus point with the <strong class="hi">Elemental Attack 3 deco</strong>, it is one of the highest value skills in the game currently.</p></div>`)}
      ${scard("Spread/Power Shots","spread_power_shots","dk-green",`<p>Increases raw damage by <strong class="hi">5%</strong> on Power Shot and Power Volley. Total modifier.</p>`)}
      ${scard("Critical Boost","affinity","dk-lav",`<p>Increases the damage of critical hits.</p><p style="padding-top:0"><strong class="hi">Default:</strong> x1.25 Critical Damage<br><strong class="hi">Lv 1:</strong> x1.28 Critical Damage<br><strong class="hi">Lv 2:</strong> x1.31 Critical Damage<br><strong class="hi">Lv 3:</strong> x1.34 Critical Damage<br><strong class="hi">Lv 4:</strong> x1.37 Critical Damage<br><strong class="hi">Lv 5:</strong> x1.40 Critical Damage</p>`)}
      ${scard("Critical Eye","affinity","dk-lav",`<p>Increases affinity.</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> +4% Affinity<br><strong class="hi">Lv 2:</strong> +8% Affinity<br><strong class="hi">Lv 3:</strong> +12% Affinity<br><strong class="hi">Lv 4:</strong> +16% Affinity<br><strong class="hi">Lv 5:</strong> +20% Affinity</p>`)}
      ${scard("Charge Master","element","dk-lblue",`<p><strong class="hi">+5/10/15% element</strong> on Charged Shot, Power Shot, Power Volley and Flying Swallow Shot.</p><ul class="cpts" style="padding-top:0"><li class="neu">Buffs the element <strong>stat</strong>, unlike Critical Element</li><li class="pro">Scales with element stacking on sets like Gogmazios 4P</li><li class="con">No effect on uncharged shots, Thousand Dragons or Dragon Piercer</li></ul><p style="padding-top:0">Thanks to element stacking, it ends up being <strong class="hi">pretty good</strong>.</p>`)}
      ${scard("Critical Element","element","dk-indigo",`<p><strong class="hi">+5/10/15% extra elemental damage</strong> on critical hits.</p><ul class="cpts" style="padding-top:0"><li class="pro">The only skill that buffs elemental <strong>output</strong>, not the element stat</li><li class="pro">Bypasses the element cap (total modifier)</li><li class="con">High-element builds lack affinity, so it rarely triggers</li></ul><p style="padding-top:0">Strong on paper, but one of the <strong class="hi">worst skills</strong> in practice.</p>`)}
      ${scard("Special Ammo Boost","spread_power_shots","dk-blue",`<p>Increases the power of the bow’s <strong class="hi">Dragon Piercer</strong>, <strong class="hi">Thousand Dragons</strong> and <strong class="hi">Tracer</strong>.</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> x1.1 Raw<br><strong class="hi">Lv 2:</strong> x1.2 Raw</p>`)}
      ${scard("Piercing Shots","spread_power_shots","dk-blue",`<p>×1.05 raw on Dragon Piercer and Thousand Dragons only. It doesn’t boost Pierce Coating (use Spread/Power Shots for that) or the Focus Strike follow-up.</p>`)}
      ${scard("Ballistics","spread_power_shots","dk-pink",`<p>No visible range gain for Close-Range Coating, measured in backhops (${yt("https://www.youtube.com/watch?v=_a15FGq17vA","test")}). Level 3 adds 5 raw in critical distance.</p>`)}
      ${scard("Bladescale Loading","spread_power_shots","t-grey",`<p>Narrowly evading a monster’s attack while your weapon is drawn grants special applied coatings.</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> Adds 3 coatings with <strong class="hi">×1.25 raw</strong>.</p>`)}
      ${scard("Convert Thunder and Water Resistance","element","dk-tw",`<p>Increases your weapon’s element proportional to your Thunder or Water resistance. Both work the same way.</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> +40 element for each point of Thunder or Water Resistance.</p>`)}
    </div></details>
    <details class="sec"><summary><span class="chev" aria-hidden="true"></span><img class="secico" src="img/armor_chest_r8.webp" alt=""><h2>Armor Skills</h2></summary>
    <div class="skills">
      ${scard("Weakness Exploit","convert_element","dk-lav",`<p>Increases the affinity of attacks that exploit a monster’s weak points and wounds.</p><div class="lvg"><span></span>${[1,2,3,4,5].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Weak hitzones</span><em>+5%</em><em>+10%</em><em>+15%</em><em>+20%</em><em>+30%</em><span class="k">Wounds</span><em>+3%</em><em>+5%</em><em>+10%</em><em>+15%</em><em>+20%</em></div><p style="padding-top:0"><strong class="hi">Note:</strong> A weak hitzone is a Raw hitzone of 45 and above.</p>`)}
      ${scard("Agitator","empower","dk-red",`<p>Increases attack power and affinity when large monsters become enraged.</p><div class="lvg"><span></span>${[1,2,3,4,5].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Raw</span><em>+4</em><em>+8</em><em>+12</em><em>+16</em><em>+20</em><span class="k">Affinity</span><em>+3%</em><em>+5%</em><em>+7%</em><em>+10%</em><em>+15%</em></div>`)}
      ${scard("Burst","empower","dk-red",`<p>Lasts <strong class="hi">3 seconds</strong> on bow.</p><div class="lvg"><span></span>${[1,2,3,4,5].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Attack</span>${[6,7,8,9,10].map(v=>`<em>+${v}</em>`).join("")}<span class="k">Element</span>${[40,60,80,100,120].map(v=>`<em>+${v}</em>`).join("")}</div><p style="padding-top:0">A very <strong class="hi">frontloaded skill</strong>: generally we only care about the <strong class="hi">first point</strong>.</p>`)}
      ${scard("Adrenaline Rush","convert_element","dk-red",`<p>Temporarily increases attack power after executing a perfectly-timed evade just as a monster attacks. Lasts <strong class="hi">30 seconds</strong>.</p><p style="padding-top:0"><strong class="hi">Lv 1:</strong> +10 Raw<br><strong class="hi">Lv 2:</strong> +15 Raw<br><strong class="hi">Lv 3:</strong> +20 Raw<br><strong class="hi">Lv 4:</strong> +25 Raw<br><strong class="hi">Lv 5:</strong> +30 Raw</p><p style="padding-top:0">Also a <strong class="hi">frontloaded skill</strong>: the <strong class="hi">first point</strong> is the most valuable.</p><p class="banner"><strong class="hi">Pro tip:</strong> Adrenaline Rush adds an invisible hitbox, which allows you to proc “on hit” skills like <strong class="hi">Convert Element</strong> and <strong class="hi">Elemental Absorption</strong> by just dodging instead of taking damage. Works on every weapon.</p>`)}
      ${scard("Antivirus","empower","dk-lav",`<p>Cures Frenzy faster, +10% affinity when cured, stacking with Black Eclipse.</p>`)}
      ${scard("Counterstrike","convert_element","dk-red",`<div class="lvg l3"><span></span>${[1,2,3].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Raw</span>${[10,15,25].map(v=>`<em>+${v}</em>`).join("")}<span class="k">Duration</span>${[30,35,45].map(v=>`<em>${v}s</em>`).join("")}</div><p>A very efficient skill, even if you only activate it sometimes while getting hit accidentally.</p><p>It procs when getting hit by an attack that knocks you over. It also activates when getting hit through hyper armor.</p><p class="banner"><strong class="hi">Pro tip:</strong> Counterstrike can be activated when taking chip damage while countering a multi hit attack.</p><video class="clip" src="vid/counterstrike_chip.mp4?v=2" poster="vid/counterstrike_chip_poster.jpg?v=2" autoplay muted loop playsinline aria-label="Counterstrike clip: chip damage from Arkveld triggers Counterstrike"></video>`)}
      ${scard("Peak Performance","convert_element","dk-red",`<p>Increases attack when your health is full.</p><div class="lvg"><span></span>${[1,2,3,4,5].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Raw</span><em>+3</em><em>+6</em><em>+10</em><em>+15</em><em>+20</em></div>`)}
      ${scard("Coalescence","empower","dk-indigo",`<p>Temporarily increases elemental attack power and status effects after recovering from blights or abnormal status.</p><div class="lvg l3"><span></span>${[1,2,3].map(n=>`<b>Lv ${n}</b>`).join("")}<span class="k">Element</span><em>x1.05</em><em>x1.1</em><em>x1.15</em><span class="k">Status</span><em>x1.05</em><em>x1.1</em><em>x1.15</em></div><p class="banner"><strong class="hi">Pro tip:</strong> Procs off of the Gore set bonus.</p>`)}
      ${scard("Evade Window","evade","dk-cyan",`${ewChart()}<p>Increases both dash i-frames and counter frames, though counter frames are less impacted. Mostly used to reduce or avoid chip damage when countering multi-hits. For more info, watch ${yt("https://youtu.be/WdmwCqzD62s","this video")}.</p>`,"evade-window")}
      ${scard("Convert Element","convert_element","t-red",`<p>Adds up to <strong class="hi">180 dragon</strong> element. Procs when you <strong class="hi">evade an elemental attack</strong> or <strong class="hi">take elemental damage</strong>. Lasts <strong class="hi">2 min</strong>, with a <strong class="hi">90 s</strong> cooldown.</p><div class="ce">
        <div class="ce-bar"><div class="ce-track"><b class="e1">+80</b><b class="e2">+40</b><b class="e3">+60</b></div><em>180 <img src="img/ce_dragon.webp" alt=""></em></div>
        <div class="ce-lv"><span class="e1">Lv 1</span><span class="e2">Lv 2</span><span class="e3">Lv 3</span></div>
      </div><p style="padding-top:.8rem"><span class="ce-chip"><img src="img/ce_blast.webp" alt="">Dragon Blast</span> Explodes for up to <strong class="hi">280 raw + 100 dragon</strong> at Lv 3. Every explosion is a <strong class="hi">guaranteed flinch</strong>.</p>`)}
      ${scard("Elemental Absorption","empower","dk-indigo",`<p>After taking elemental damage, temporarily grants you element effects. (Cooldown after effect ends)</p><div class="lvg ea"><span></span><b>Element</b><b>Element Res.</b><span class="k">Lv 1</span><em class="arr">+30<span class="ar">→</span>+40<span class="ar">→</span>+50</em><em class="arr">+4<span class="ar">→</span>+8<span class="ar">→</span>+12</em><span class="k">Lv 2</span><em class="arr">+40<span class="ar">→</span>+50<span class="ar">→</span>+60</em><em class="arr">+6<span class="ar">→</span>+12<span class="ar">→</span>+18</em><span class="k">Lv 3</span><em class="arr">+50<span class="ar">→</span>+60<span class="ar">→</span>+70</em><em class="arr">+8<span class="ar">→</span>+16<span class="ar">→</span>+24</em></div><p style="padding-top:0"><strong class="hi">Note:</strong> The Elemental Resistance bonus only applies to the element you absorbed.</p>`)}
    </div></details>
  `},

  patches:{ group:"Resources", icon:"patches", title:"Patch Changes and Bugs", desc:"Bow changes from TU1 to TU4 and known bugs", html:()=>`
    <article class="guide">
      <h1 class="page-h">Patch Changes and Bugs</h1>
      <p class="page-lede">What changed for bow in each title update.</p>
      <h2>Title Update 4</h2>
      <p>Gogma Artian weapons arrive as the new best in slot. Pierce Coating gets a huge buff, so Close-Range bows aren’t the only option. Power Coating’s raw buff doesn’t save it. Gogmazios armor adds a lot of element and comfort.</p>
      <ul>
        <li>Coating reload animation is shorter.</li>
        <li>Tracer can be buffered during Discerning Dodge.</li>
        <li>Power Coating raw: ×1.3 → ×1.35.</li>
        <li>Element cap raised to ×2.3 of the weapon’s base element.</li>
      </ul>
      <div class="card tablewrap"><table>
        <thead><tr><th>Move</th><th>Motion value</th><th>Element</th></tr></thead>
        <tbody>
          <tr><td>Charged Shot 3</td><td>11 → 12</td><td>0.6 → 1.0</td></tr>
          <tr><td>Power Shot 3</td><td>11 → 12</td><td>0.6 → 0.8</td></tr>
          <tr><td>Flying Swallow</td><td>11 → 12</td><td>0.6 → 0.8</td></tr>
          <tr><td>Power Volley 3</td><td>14 → 15</td><td>0.75 → 1.0</td></tr>
          <tr><td>Arc Shot 3 (arrows, fuse, explosion)</td><td>+1 each</td><td></td></tr>
          <tr><td>Thousand Dragons</td><td>23 → 25</td><td></td></tr>
          <tr><td>Dragon Piercer</td><td>23 → 25</td><td></td></tr>
          <tr><td>Tracer Arrow (impact, explosion)</td><td>25 → 30</td><td></td></tr>
          <tr><td>Pierce Charged Shot 3</td><td>5 → 6</td><td>0.2 → 0.4</td></tr>
          <tr><td>Pierce Power Shot 3</td><td>5 → 6</td><td>0.2 → 0.27</td></tr>
          <tr><td>Pierce Power Volley 3</td><td>6 → 7</td><td>0.25 → 0.34</td></tr>
          <tr><td>Pierce Thousand Dragons</td><td>11 → 13</td><td></td></tr>
        </tbody>
      </table></div>
      <h2>Title Update 1</h2>
      <ul>
        <li>Dragon Piercer damage per tick falls off faster.</li>
        <li>Power Volley element multipliers +0.1 (to 0.45 / 0.65 / 0.75).</li>
        <li>Power Shot and Power Volley now benefit from Charge Master.</li>
        <li>Thousand Dragons 18 → 23, Tracer Thousand Dragons 21 → 26.</li>
        <li>Corrupted Mantle nerfed.</li>
      </ul>
    </article>
  `},

    <h1 class="page-h">Videos</h1>
    <p class="page-lede">YouTube channels worth following for bow.</p>
    <a class="card chan mine" href="https://youtube.com/@lyonolivier69" target="_blank" rel="noopener"><img class="chan-av" src="img/tidus_logo.webp" alt=""><span class="txt"><strong>Tidus69</strong><span>Guides and informative content (shameless plug)</span></span><span class="chan-go">Visit ↗</span></a>
    <h2 class="section-h">Speedrunners</h2>
    <p class="section-sub">Some of the best active speedrunners.</p>
    <div class="chans">
      <a class="card chan" href="https://youtube.com/@nekogami_kuroha" target="_blank" rel="noopener"><svg class="ytico" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg><span class="txt"><strong>@nekogami_kuroha</strong><span>Speedruns</span></span><span class="chan-go">↗</span></a>
      <a class="card chan" href="https://youtube.com/@iroha104" target="_blank" rel="noopener"><svg class="ytico" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg><span class="txt"><strong>@iroha104</strong><span>Speedruns</span></span><span class="chan-go">↗</span></a>
    </div>
  `}
};
const NAVICON = {home:"home"};

const ORDER = ["home","low-rank","high-rank","endgame","basics","focus-mode","combos","stamina","skills","matchups","patches","tools","videos"];

// nav
const side = document.getElementById("side");
const groups = {};
ORDER.forEach(id=>{ const g = VIEWS[id].group || "Start"; (groups[g] ||= []).push(id); });
side.innerHTML = Object.entries(groups).map(([g,ids])=>`
  <div class="navgroup"><h4>${g}</h4>${ids.map(id=>{ const ic = VIEWS[id].icon || NAVICON[id]; const st = NAVSTAR[id]; return `<a href="#${id}" data-id="${id}"${st?` class="navbuild ${st[1]}" style="--star:${st[0]}"`:""}>${st?`<svg class="navstar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l2.9 6.6 7.2.6-5.5 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L1.9 9l7.2-.6z" fill="${st[0]}" stroke="#2a1406" stroke-width="1.6" stroke-linejoin="round"/></svg>`:ic?`<img src="img/${ic}.webp" alt="">`:""}${VIEWS[id].title}</a>`; }).join("")}</div>`).join("");

const main = document.getElementById("main");
let navDepth = 0;
const menuBtn = document.getElementById("menuBtn");
const clipObs = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if(e.isIntersecting){ v.muted = true; v.play().catch(()=>{}); } else if(!v.paused) v.pause(); }), { rootMargin:"300px 0px" });
function render(){
  let [id, anchor] = location.hash.replace("#","").split("/");
  if(!VIEWS[id]) id = "home";
  main.innerHTML = `<div class="view">${id==="home"?"":`<button class="iconbtn backbtn" type="button"><span aria-hidden="true">←</span> Back</button>`}${VIEWS[id].html().replace(/<video([^>]*?) autoplay/g,'<video$1 data-lazy preload="none"')}</div>`;
  navDepth++;
  document.body.classList.toggle("is-home", id==="home");
  document.title = id==="home" ? "Wilds Bow Guide" : `${VIEWS[id].title} · Wilds Bow Guide`;
  side.querySelectorAll("a").forEach(a=>{ if(a.dataset.id===id) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  side.classList.remove("open"); menuBtn.setAttribute("aria-expanded","false"); document.body.classList.remove("navlock");
  // Clips load and play only when scrolled near the screen, and pause when off screen (keeps mobile data fast)
  clipObs.disconnect();
  main.querySelectorAll("video[data-lazy]").forEach(v=>clipObs.observe(v));
  const t = anchor && document.getElementById(anchor);
  if(t){ if(t.tagName==="DETAILS") t.open = true; const sec = t.closest("details.sec"); if(sec) sec.open = true; t.scrollIntoView(); t.classList.add("flash"); } else window.scrollTo(0,0);
}
menuBtn.addEventListener("click",()=>{ const o = side.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o); document.body.classList.toggle("navlock", o); });
window.addEventListener("hashchange", render);
render();

// build version switch (e.g. Constitution 2 / 5)
main.addEventListener("click", e=>{ const t = e.target.closest("[data-variant]"); if(!t) return; const box = t.closest(".build"); const n = +t.dataset.variant;
  box.querySelectorAll("[data-variant]").forEach(x=>x.setAttribute("aria-selected", x===t));
  box.querySelectorAll(".variant").forEach((v,i)=>v.hidden = i!==n); });

// back arrow: previous page inside the site, else Home
main.addEventListener("click", e=>{ const t = e.target.closest("[data-cbmode]"); if(!t) return; const w = t.closest(".cb-wrap");
  w.querySelectorAll("[data-cbmode]").forEach(x=>x.setAttribute("aria-selected", x===t)); w.classList.toggle("pierce", t.dataset.cbmode==="pi"); });
main.addEventListener("click", e=>{ if(!e.target.closest(".backbtn")) return; if(navDepth>1) history.back(); else location.hash = "#home"; });

// in-page jumps (the hash is used for page routing, so scroll instead of linking)
main.addEventListener("click", e=>{ const b = e.target.closest("[data-scroll]"); if(!b) return; const t = document.getElementById(b.dataset.scroll); if(!t) return;
  // make sure the page is tall enough for the target to reach the top, then re-align once lazy content has settled
  const view = t.closest(".view"), goal = ()=> t.getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(t).scrollMarginTop || 0);
  if(view){ view.style.paddingBottom = ""; const short = goal() + innerHeight - document.documentElement.scrollHeight; if(short > 0) view.style.paddingBottom = `${short}px`; }
  t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  let n = 0; const fix = ()=>{ if(Math.abs(scrollY - goal()) > 2) window.scrollTo(0, goal()); if(++n < 3) setTimeout(fix, 400); }; setTimeout(fix, 900); });

// build image zoom
const zoomDlg = document.getElementById("zoomDlg"), zoomImg = document.getElementById("zoomImg");
main.addEventListener("click", e=>{ const b = e.target.closest("[data-zoom]"); if(!b) return; zoomImg.src = b.dataset.zoom; zoomImg.alt = b.querySelector("img").alt; zoomDlg.showModal(); });
document.getElementById("zoomClose").addEventListener("click", ()=>zoomDlg.close());
zoomDlg.addEventListener("click", e=>{ if(e.target===zoomDlg) zoomDlg.close(); });

// search
const dlg = document.getElementById("searchDlg"), q = document.getElementById("q"), results = document.getElementById("results");
let sel = 0;
function doSearch(){
  const term = q.value.trim().toLowerCase();
  const hits = ORDER.filter(id=>{ const v = VIEWS[id]; return !term || (v.title+" "+v.desc+" "+(v.group||"")).toLowerCase().includes(term); });
  sel = 0;
  results.innerHTML = hits.length ? hits.map((id,i)=>`<li><a href="#${id}" class="${i===0?"sel":""}">${VIEWS[id].title}<small>${VIEWS[id].group||"Start"}: ${VIEWS[id].desc}</small></a></li>`).join("")
    : `<li class="empty">No pages match “${q.value}”. Try a monster, build stage or guide name.</li>`;
}
function openSearch(){ q.value=""; doSearch(); dlg.showModal(); q.focus(); }
document.getElementById("searchBtn").addEventListener("click", openSearch);
document.addEventListener("keydown", e=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); }});
q.addEventListener("input", doSearch);
q.addEventListener("keydown", e=>{
  const links = [...results.querySelectorAll("a")];
  if(!links.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); links[sel].classList.remove("sel"); sel = (sel + (e.key==="ArrowDown"?1:-1) + links.length) % links.length; links[sel].classList.add("sel"); links[sel].scrollIntoView({block:"nearest"}); }
  if(e.key==="Enter"){ e.preventDefault(); location.hash = links[sel].getAttribute("href"); dlg.close(); }
});
results.addEventListener("click", e=>{ if(e.target.closest("a")) dlg.close(); });
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });
</script>
